services:
  - type: web
    name: niangao-backend
    env: python
    rootDir: backend
    # 语音（可选）：云端没有装 edge-tts / vosk，播报会自动降级成浏览器语音、麦克风按钮自动隐藏。
    # 想开服务端播报：把下面的 buildCommand 末尾加上 `&& pip install edge-tts`。
    # 离线识别不建议在免费实例开（Vosk 模型常驻约 100~200MB 内存）。
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: niangao
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.deepseek.com
      - key: LLM_MODEL
        value: deepseek-chat
      # 部署完成后填前端域名，例如 https://niangao-ai.vercel.app
      - key: CORS_ORIGINS
        sync: false
